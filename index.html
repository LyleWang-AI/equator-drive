<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赤道公路 Equator Drive</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #fff; user-select: none; }
    #app canvas { display: block; }
    .panel {
      position: fixed; padding: 12px 16px; border-radius: 12px;
      background: rgba(10, 20, 30, 0.42); backdrop-filter: blur(6px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); transition: opacity 0.4s;
    }
    body.hud-hidden .panel, body.hud-hidden #mapbar { opacity: 0; pointer-events: none; }
    #where { top: 16px; left: 16px; min-width: 260px; }
    #region-zh { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    #region-en { font-size: 13px; opacity: 0.75; margin-top: 2px; }
    #coord { font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }
    #localtime { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    #nextland { font-size: 13px; margin-top: 6px; color: #9fd8ff; }
    #progress { top: 16px; right: 16px; width: 250px; font-size: 13px; }
    #progress .row { display: flex; justify-content: space-between; margin: 3px 0; }
    #progress .big { font-size: 20px; font-weight: 700; }
    #barwrap { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); margin: 6px 0 8px; overflow: hidden; }
    #bar { height: 100%; width: 0; background: linear-gradient(90deg, #f7c548, #e8593c); }
    #dash { bottom: 52px; left: 16px; }
    #speed { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    #speed-unit { font-size: 14px; opacity: 0.8; margin-left: 4px; }
    #mode { font-size: 13px; margin-top: 6px; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.15); display: inline-block; }
    #mode.on { background: rgba(60, 190, 130, 0.55); }
    #help { bottom: 52px; right: 16px; font-size: 12px; line-height: 1.75; opacity: 0.9; }
    #help b { display: inline-block; min-width: 54px; color: #f7c548; }
    #toast {
      position: fixed; top: 22%; left: 50%; transform: translate(-50%, -10px);
      text-align: center; opacity: 0; transition: opacity 0.6s, transform 0.6s; pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast .t { font-size: 34px; font-weight: 700; letter-spacing: 2px; }
    #toast .s { font-size: 16px; margin-top: 6px; opacity: 0.9; }
    #mapbar { position: fixed; left: 16px; right: 16px; bottom: 16px; height: 22px; transition: opacity 0.4s; }
    #minimap { width: 100%; height: 12px; margin-top: 5px; border-radius: 6px; display: block; opacity: 0.85; }
    #marker {
      position: absolute; top: 0; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px;
      background: #ffeb3b; box-shadow: 0 0 6px #ffeb3b;
    }
    #strip-info {
      display: none; position: fixed; left: 0; right: 0; top: 0; bottom: 220px;
      flex-direction: column; justify-content: flex-end; padding: 28px 32px 16px;
      color: #d5dde6;
    }
    .strip-copy { margin: auto; max-width: 560px; text-align: center; }
    .strip-copy h2 { margin: 0 0 10px; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .strip-copy p { margin: 0; font-size: 16px; line-height: 1.75; opacity: 0.88; }
    .strip-status { display: flex; justify-content: space-between; align-items: flex-end; font-size: 18px; }
    #strip-info .hint { font-size: 14px; opacity: 0.7; }
    body.strip-mode { background: #10161c; }
    body.strip-mode #app { position: fixed; left: 0; right: 0; bottom: 0; height: 220px; }
    body.strip-mode .panel, body.strip-mode #mapbar, body.strip-mode #toast { display: none; }
    body.strip-mode #strip-info { display: flex; }
    #gate, #journal, #finish {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(8, 14, 20, 0.72); z-index: 5;
    }
    #gate.hidden, #journal, #finish { display: none; }
    #journal.show, #finish.show { display: flex; }
    .card {
      width: min(560px, calc(100% - 40px)); padding: 28px 28px 22px; border-radius: 16px;
      background: rgba(16, 26, 36, 0.94); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .card h2 { margin: 0 0 8px; font-size: 28px; }
    .card .lead { margin: 0 0 18px; line-height: 1.6; opacity: 0.85; }
    .card button, .starts button {
      font: inherit; color: #fff; cursor: pointer; border: 0; border-radius: 10px;
      padding: 12px 14px; background: #2a6a4a;
    }
    .card button.ghost { background: rgba(255, 255, 255, 0.12); }
    #go-continue { width: 100%; margin-bottom: 14px; font-size: 16px; }
    .langs { display: flex; gap: 8px; margin: 0 0 14px; }
    .langs button { flex: 1; background: rgba(255, 255, 255, 0.1); }
    .langs button.on { background: #2a6a4a; }
    #progress .langs { margin: 8px 0 0; }
    #progress .langs button { padding: 6px 8px; font-size: 12px; }
    .starts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .starts button { background: rgba(255, 255, 255, 0.1); }
    .starts small { display: block; opacity: 0.7; font-size: 12px; margin-top: 4px; }
    #journal .card, #finish .card { width: min(720px, calc(100% - 40px)); max-height: calc(100% - 48px); overflow: auto; }
    #journal-stamps { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
    .stamp { padding: 6px 10px; border-radius: 999px; background: #8a3b1f; font-size: 13px; }
    .empty { opacity: 0.7; }
    #journal-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    #journal-photos figure { margin: 0; }
    #journal-photos img { width: 100%; border-radius: 8px; display: block; }
    #journal-photos figcaption { font-size: 12px; opacity: 0.75; margin-top: 4px; }
    .card .row-end { display: flex; justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="gate">
    <div class="card">
      <div class="langs">
        <button type="button" data-set-lang="zh">中文</button>
        <button type="button" data-set-lang="en">English</button>
      </div>
      <h2 data-i18n="title">赤道公路</h2>
      <p class="lead" data-i18n="lead">沿着赤道向东开。海洋占了大部分，陆地上会经过十一个国家。</p>
      <button id="go-continue" type="button" data-i18n="continue">继续上次的旅程</button>
      <div class="starts">
        <button type="button" data-lon="-80.32"><span data-i18n="startEc">厄瓜多尔</span><small data-i18n="startEcSub">从海岸进城</small></button>
        <button type="button" data-lon="37.05"><span data-i18n="startKe">肯尼亚</span><small data-i18n="startKeSub">高原和草原</small></button>
        <button type="button" data-lon="109.33"><span data-i18n="startId">印度尼西亚</span><small data-i18n="startIdSub">坤甸，赤道线上</small></button>
      </div>
    </div>
  </div>

  <div id="journal">
    <div class="card">
      <h2 data-i18n="journalTitle">旅行手册</h2>
      <p class="lead" data-i18n="journalLead">盖过的章和拍过的照片会留在这台浏览器里。</p>
      <div id="journal-stamps"></div>
      <div id="journal-photos"></div>
      <div class="row-end"><button id="journal-close" class="ghost" type="button" data-i18n="close">关闭</button></div>
    </div>
  </div>

  <div id="finish">
    <div class="card">
      <h2 data-i18n="finishTitle">绕赤道回到了起点</h2>
      <p class="lead" id="finish-text"></p>
      <div class="row-end"><button id="finish-go" type="button" data-i18n="finishGo">继续开</button></div>
    </div>
  </div>

  <div id="where" class="panel">
    <div id="region-zh">—</div>
    <div id="region-en"></div>
    <div id="coord"></div>
    <div id="localtime"></div>
    <div id="nextland" style="display: none"></div>
  </div>

  <div id="progress" class="panel">
    <div class="row"><span data-i18n="progTrip">环赤道里程</span><span id="pct">0%</span></div>
    <div class="big" id="km">0 km</div>
    <div id="barwrap"><div id="bar"></div></div>
    <div class="row"><span data-i18n="progScale">地理倍率</span><span id="scale"></span></div>
    <div class="row"><span data-i18n="progTime">时间流速</span><span id="tspeed"></span></div>
    <div class="row"><span data-i18n="progPassport">护照</span><span id="stamps">0 / 12</span></div>
    <div class="row"><span data-i18n="progWeather">天气</span><span id="weather"></span></div>
    <div class="row"><span data-i18n="progSound">声音</span><span id="sound"></span></div>
    <div class="langs">
      <button type="button" data-set-lang="zh">中文</button>
      <button type="button" data-set-lang="en">English</button>
    </div>
  </div>

  <div id="dash" class="panel">
    <div><span id="speed">0</span><span id="speed-unit">km/h</span></div>
    <div id="mode"></div>
  </div>

  <div id="help" class="panel" data-i18n-html="help"></div>

  <div id="strip-info">
    <div class="strip-copy">
      <h2 data-i18n="stripTitle">底部窄条</h2>
      <p data-i18n="stripBody">公路收在屏幕最底下，自己往前开。上面这块空出来，是让你一边做事、一边瞟风景。画面变窄是故意的，不是故障。</p>
    </div>
    <div class="strip-status"><span id="strip-label">赤道公路</span><span class="hint" data-i18n="stripHint">按 G 或 Esc 回到全屏</span></div>
  </div>
  <div id="toast"></div>

  <div id="mapbar">
    <canvas id="minimap"></canvas>
    <div id="marker"></div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/geo.js"></script>
  <script src="src/world.js"></script>
  <script src="src/car.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/sealife.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/traffic.js"></script>
  <script src="src/compose.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
